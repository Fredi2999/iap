[package]
name = "pa-pci"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "pa_pci"
path = "src/lib.rs"

# Eigenständiger Begleiter: läuft auf dem Host-PC, während der Stick draußen ist.
# Sichtbar (Konsolenfenster), schreibt nur ein lokales Aktivitätsjournal, nie ins Netz.
[[bin]]
name = "iap-pci"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Nur Windows: Vordergrundfenster und Leerlaufzeit über die eingebauten Win32-APIs.
# Das `windows`-Crate liegt über die App bereits im Baum; hier nur wenige Features.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
