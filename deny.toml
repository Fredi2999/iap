# Lizenz- und Sicherheitsprüfung der Rust-Abhängigkeiten (cargo deny check).
#
# Warum: IAP steht unter Apache-2.0 und wird weitergegeben (Stick, GitHub). Eine Abhängigkeit mit
# Copyleft-Lizenz (GPL, AGPL) oder ohne Lizenz würde das stillschweigend ändern. Die Liste unten ist
# der Stand der Prüfung vom 2026-10-02 (siehe THIRD-PARTY-NOTICES.md). Eine neue Lizenz bricht den
# Lauf absichtlich: Sie muss bewusst hier eingetragen werden.
# Geprüft wird nur der Windows-Abhängigkeitsbaum, weil dort ausgeliefert wird.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
confidence-threshold = 0.9
# Erlaubte, aber derzeit ungenutzte Lizenzen sind kein Fehler und keine Warnung.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
  "0BSD",
  "BSL-1.0",
]

[advisories]
# Bekannte Sicherheitslücken aus der RustSec-Datenbank. Die Datenbank wird beim Lauf geladen; das
# geschieht nur in der CI, nie in der ausgelieferten App (Invariante: kein ausgehender Verkehr).
version = 2
yanked = "deny"
# Nur „nicht mehr gepflegt“, keine Sicherheitslücke; kommen über Tauri (urlpattern) und lassen sich
# von hier aus nicht ersetzen. Beim nächsten Tauri-Update erneut prüfen.
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range, transitiv über Tauri, nur ungepflegt" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common, transitiv über Tauri, nur ungepflegt" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property, transitiv über Tauri, nur ungepflegt" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, transitiv über Tauri, nur ungepflegt" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, transitiv über Tauri, nur ungepflegt" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Pfadabhängigkeiten innerhalb des Workspaces haben keine Versionsangabe.
allow-wildcard-paths = true
# HTTP-Clients sind in IAP verboten (Invariante 1): Netzzugriff läuft nur über WinHTTP.
deny = [
  { name = "reqwest" },
  { name = "hyper-util" },
  { name = "ureq" },
  { name = "isahc" },
  { name = "surf" },
  { name = "attohttpc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
